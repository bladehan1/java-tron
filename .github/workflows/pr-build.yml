name: PR Build

on:
  pull_request:
    branches: [ 'master','develop', 'release_**' ]
    types: [ opened, synchronize, reopened ]
    paths:
      - '**/*.java'
      - '**/*.gradle'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docker-build-debian11:
    name: Build debian11 (JDK 8 / x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    container:
      image: eclipse-temurin:8-jdk # base image is Debian 11 (Bullseye)

    defaults:
      run:
        shell: bash

    env:
      GRADLE_USER_HOME: /github/home/.gradle

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install dependencies (Debian + build tools)
        run: |
          set -euxo pipefail
          apt-get update
          apt-get install -y git wget unzip build-essential curl jq

      - name: Check Java version
        run: java -version

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            /github/home/.gradle/caches
            /github/home/.gradle/wrapper
          key: debian11-x86_64-gradle-${{ hashFiles('**/*.gradle', '**/gradle-wrapper.properties') }}
          restore-keys: |
            debian11-x86_64-gradle-

      - name: Build (no tests)
        run: ./gradlew clean assemble --no-daemon

      - name: Run smoke unit tests
        run: |
          ./gradlew \
            :framework:test --tests "org.tron.common.ParameterTest" --tests "org.tron.common.ComparatorTest" \
            :plugins:test --tests "org.tron.plugins.utils.ByteArrayTest" \
            --no-daemon

      - name: Generate module coverage reports
        run: |
          ./gradlew jacocoTestReport --no-daemon

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: jacoco-coverage-reports
          path: |
            **/build/reports/jacoco/test/jacocoTestReport.xml
          if-no-files-found: error

  coverage:
    name: Coverage Check
    needs: docker-build-debian11
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download coverage reports
        uses: actions/download-artifact@v4
        with:
          name: jacoco-coverage-reports
          path: coverage-input

      - name: Collect coverage report paths
        id: collect-xml
        run: |
          XMLS=$(find coverage-input -name "jacocoTestReport.xml" | sort | paste -sd, -)
          if [ -z "$XMLS" ]; then
            echo "No jacocoTestReport.xml files found."
            exit 1
          fi
          echo "xmls=$XMLS" >> "$GITHUB_OUTPUT"

      - name: Add coverage to PR
        id: jacoco
        uses: madrapps/jacoco-report@v1.7.2
        with:
          paths: ${{ steps.collect-xml.outputs.xmls }}
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 0
          min-coverage-changed-files: 0
          skip-if-no-changes: true
          title: '## Code Coverage Report'
          update-comment: true

      - name: Coverage summary
        run: |
          echo "Overall Coverage: ${{ steps.jacoco.outputs.coverage-overall }}"
          echo "Changed Files Coverage: ${{ steps.jacoco.outputs.coverage-changed-files }}"
